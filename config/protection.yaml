# impl: FR-008-08
# Версіонований захист публічного API (фіча 008; research R-7). Схема: specs/008-api-protection-ops/data-model.md.
# Значення НЕ змінюють кластери, оцінку чи смугу (FR-008-08): лише межі запитів, одночасності й бота.
# Будь-яка зміна: підняти version і додати запис із sha256 у config/CHANGELOG.md (розділ "# config/protection.yaml").
version: 1

# --- Ліміт запитів до API на IP-адресу клієнта ---
api:
  requests_per_window: 30          # int >= 1. Скільки запитів дозволено за одне вікно з одного клієнта.
  window_seconds: 60               # int >= 1. Довжина ковзного вікна в секундах.

# --- Одночасні важкі (холодні) аналізи ---
heavy:
  max_concurrent: 3                # int >= 1. Скільки холодних аналізів виконуються одночасно в процесі.
  busy_retry_after_seconds: 60     # int >= 1. Значення Retry-After (секунди), коли слоти зайняті.

# --- Довірені проксі: з яких адрес приймаємо X-Forwarded-For ---
proxy:
  trusted: ["127.0.0.1", "::1"]    # список IP або мереж (CIDR); порожній список дозволено.

# --- Ліміт перевірок Telegram-бота на користувача ---
bot:
  checks_per_window: 5             # int >= 1. Скільки нових токенів бот приймає за одне вікно від одного користувача.
  window_seconds: 600              # int >= 1. Довжина вікна бота в секундах.
