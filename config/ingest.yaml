# Версіонована конфігурація збору (принцип III). Схема: specs/001-onchain-data-ingest/contracts/config-ingest.md
# Будь-яка зміна: підняти version і додати запис у config/CHANGELOG.md у тому ж коміті.
version: 3

first_buyers_n: 300
funding_depth: 2
counterparty_threshold: 200
max_signatures_per_wallet: 300
collect_spl_inbound: true
time_budget_seconds: 600
commitment: finalized

rpc:
  page_size: 1000          # лише limit сторінки getSignaturesForAddress
  tx_batch_size: 25        # підписів в одному get_transactions ядра (≤ під-batch адаптера; на результат не впливає)
  request_timeout_seconds: 10
  max_retries: 2
  retry_backoff_seconds: 0.5
  max_concurrency: 8
