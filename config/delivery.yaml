# Версіонована конфігурація доставки (принцип III — лише для показових і операційних сталих).
# Схема: specs/004-api-bot-delivery/data-model.md («Показові сталі»).
# ЖОДНИХ чисел, що змінюють кластери/впевненість/risk_score/смугу, тут немає і бути не може:
# пороги й ваги живуть у config/{ingest,hubs,hub_addresses,clusters}.yaml.
# Будь-яка зміна: підняти version і додати запис із sha256 у config/CHANGELOG.md (розділ "# config/delivery.yaml").
version: 1

# --- Операційні ---
http_port: 8080                    # int 1..65535. Порт умовчання локального HTTP-сервера (прапорець --port перекриває).

# --- Показові: PNG ---
png_width: 1200                     # int >= 1. Ширина полотна картинки графа в пікселях.
png_height: 800                    # int >= 1. Висота полотна.
cluster_palette:                   # непорожній список кольорів кластерів (#rrggbb); i-й кластер у порядку частки → i-й колір за модулем.
  - "#e74c3c"
  - "#3498db"
  - "#2ecc71"
  - "#f39c12"
  - "#9b59b6"
  - "#1abc9c"
  - "#e67e22"
  - "#95a5a6"
address_prefix_len: 6              # int >= 1. Скільки перших символів адреси показувати в підписах PNG.

# --- Показові: текст бота ---
evidence_preview_limit: 4000       # int >= 1. Максимум символів тексту доказів в одному повідомленні; решта — другим повідомленням.
