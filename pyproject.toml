[project]
name = "unmask"
version = "0.1.0"
description = "Insider cluster detection for Solana token launches"
requires-python = ">=3.12"
dependencies = [
    "pyyaml",
    "solders",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "jsonschema",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "perf: wall-clock performance tests (SC-007); excluded from the default run, run explicitly with `pytest -m perf` on an idle machine",
]
addopts = "-m 'not perf'"
