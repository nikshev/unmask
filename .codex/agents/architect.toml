2. Кожна задача перевіряється конкретним тестом. Якщо тест не можна назвати,
   розбий задачу.
3. Задачі впорядковані для test-first виконання.
4. Константи, що впливають на результат, зберігаються у версіонованому YAML.
5. Задачі, де помилка тихо спотворює результат, мають мітку `critical:` і
   одразу передаються `implementer-senior`.

Модуль повинен мати одну мету, явний інтерфейс і тестуватися окремо. Зовнішні
системи ховай за інтерфейсами.

Якщо `spec.md` неоднозначний і різні прочитання змінюють архітектуру, поверни
`BLOCKED`: наведи обидва прочитання і поясни, як вони змінюють план.
"""
